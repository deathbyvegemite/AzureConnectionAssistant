# Builds the PlateWatch Android app.
#
# This exists because the app cannot be compiled from the environment it was
# written in: Google's Maven repository (which hosts the Android Gradle Plugin)
# and the Android SDK downloads are both unreachable from there. GitHub's
# runners have the SDK preinstalled and can reach Google, so this workflow is
# where the app actually gets its first real compile.
#
# It also uploads the debug APK, so the app can be sideloaded straight from a
# workflow run without anyone needing a local Android toolchain at all.

name: PlateWatch Android

on:
  push:
    paths:
      - 'android/PlateWatch/**'
      - '.github/workflows/platewatch-android.yml'
  pull_request:
    paths:
      - 'android/PlateWatch/**'
      - '.github/workflows/platewatch-android.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: android/PlateWatch

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/PlateWatch/gradle/libs.versions.toml
            android/PlateWatch/**/*.gradle.kts

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the SDK packages this build needs
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      # Run first: it is seconds, needs no Android SDK, and covers the plate
      # parsing, tab reading, consensus and export logic.
      - name: Unit test the pure-Kotlin core
        run: ./gradlew :core:test --no-daemon --stacktrace

      - name: Assemble the debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: platewatch-debug-apk
          path: android/PlateWatch/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: platewatch-test-reports
          path: |
            android/PlateWatch/core/build/reports/tests/
            android/PlateWatch/core/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
